baseURL = "https://adenniansyah.github.io/paljie-media/"
languageCode = "id"
title = "Paljie Media - Content Creator"
theme = "blowfish"

[params]
  defaultTheme = "dark"
  description = "Website konten creator untuk live streaming, vlog harian, podcast, dan news"
  mainSections = ["posts"]
  
  [params.author]
    name = "Arjuanda"
    image = "img/avatar.png"
    headline = "Content Creator | Live Streamer | Podcaster"
    bio = "Membuat konten live streaming, vlog harian, podcast, dan berita terkini."
    links = [
      { youtube = "https://youtube.com/@channel-anda" },
      { instagram = "https://instagram.com/username-anda" },
      { tiktok = "https://tiktok.com/@username-anda" },
      { twitter = "https://twitter.com/username-anda" },
      { github = "https://github.com/adenniansyah" }
    ]

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Vlog"
    pageRef = "/categories/vlog"
    weight = 20
  [[menus.main]]
    name = "Podcast"
    pageRef = "/categories/podcast"
    weight = 30
  [[menus.main]]
    name = "News"
    pageRef = "/categories/news"
    weight = 40
  [[menus.main]]
    name = "Live"
    pageRef = "/categories/live"
    weight = 50
